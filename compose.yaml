services:
  inkveil:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - inkveil-data:/app/data
    environment:
      INKVEIL_MYSQL_DSN: ${INKVEIL_MYSQL_DSN:-}
      INKVEIL_PUBLIC_URL: ${INKVEIL_PUBLIC_URL:-}
      INKVEIL_ADMIN_PASSWORD: ${INKVEIL_ADMIN_PASSWORD:-}
      INKVEIL_SYNC_URL: ${INKVEIL_SYNC_URL:-}
      INKVEIL_SYNC_SOURCE: ${INKVEIL_SYNC_SOURCE:-}
      INKVEIL_SYNC_INTERVAL: ${INKVEIL_SYNC_INTERVAL:-30m}
      INKVEIL_SYNC_PERMISSION: ${INKVEIL_SYNC_PERMISSION:-}
    restart: unless-stopped
volumes:
  inkveil-data:
